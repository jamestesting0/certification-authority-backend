plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.chuk-ca'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'com.hazelcast:hazelcast-spring:5.3.5'
	implementation 'com.hazelcast:hazelcast:5.3.5'

	implementation 'jakarta.annotation:jakarta.annotation-api:2.0.0' // Jakarta Annotation
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.76' // Bouncy Castle

	runtimeOnly 'org.postgresql:postgresql:42.7.2' // JDBC Driver

	compileOnly 'org.projectlombok:lombok'
	compileOnly 'org.jetbrains:annotations:24.0.1' // JetBrains Annotations
	annotationProcessor 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.hazelcast:hazelcast-spring:5.3.5'
	testImplementation 'com.h2database:h2'
	testImplementation 'com.icegreen:greenmail:1.6.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
